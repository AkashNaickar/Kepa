[project]
name = "kepa"
version = "0.1.0"
description = "Memory layer for coding agents: GitHub webhooks -> Bedrock -> CockroachDB, recalled via MCP"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
